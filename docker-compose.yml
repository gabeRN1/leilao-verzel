name: leilao

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao
      POSTGRES_DB: leilao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leilao"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://leilao:leilao@db:5432/leilao
      JWT_SECRET: ${JWT_SECRET:-troque-isto}
      HARVARD_API_KEY: ${HARVARD_API_KEY:-}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    environment:
      API_URL_INTERNAL: http://api:3001
    ports:
      - "3000:3000"

volumes:
  pgdata: